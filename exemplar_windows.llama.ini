# Windows example: copy to llama.ini, then edit folders and GGUF paths.
# The launcher reads llama.ini by default; this file is a reference template.
# Use double quotes for flags containing spaces; paths can use / or backslash.
[settings]
editor = notepad.exe
filter_request_logs = true

[instance:regular]
folder = C:/LLM/llama.cpp
binary = build/bin/llama-server.exe
build_dir = build
jobs = 12
configure_flags = -G Ninja -DCMAKE_BUILD_TYPE=Release -DGGML_CUDA=ON -DGGML_NATIVE=ON

[instance:ik-ft]
folder = C:/LLM/ik_llama_ft.cpp
binary = build/bin/llama-server.exe
build_dir = build
jobs = 12
configure_flags = -G Ninja -DCMAKE_BUILD_TYPE=Release -DGGML_CUDA=ON -DGGML_NATIVE=ON

[model:qwen-regular]
instance = regular
path = D:/GGUF/Qwen3.6-35B-A3B-UD-Q4_K_M.gguf
flags = --alias hz --host 0.0.0.0 --ctx-size $((64 * 1024)) -ngl 999
    --jinja --temp 0.6 --top-k 24 --top-p 0.95 --min-p 0.0
# Optional environment variables:
# env = GGML_CUDA_LAUNCH_BLOCKING=1 GGML_CUDA_GRAPH_OPT=1
# Optional host RAM estimate including context/cache:
# ram_gib = 28

[model:qwen-ik-ft]
instance = ik-ft
path = D:/GGUF/Qwen3.6-35B-A3B-UD-Q4_K_M.gguf
flags = --alias hz --host 0.0.0.0 -ctk q4_0 -ctv q4_0
    -ctv-first q8_0,4 -ctv-last q8_0,4 -cmoe
    --ctx-size $((64 * 1024)) --jinja -fa on --no-mmap --no-context-shift
    --temp 0.6 --top-k 24 --top-p 0.95 --min-p 0.0 -ngl 999 -np 1
    --samplers "penalties;dry;top_n_sigma;top_k;typ_p;top_p;min_p;xtc;temperature"


[model:gemma4-ik-ft]
instance = ik-ft
path = D:/GGUF/gemma-4-26B-A4B-it-UD-Q4_K_M.gguf
flags = --alias hz --host 0.0.0.0 -ctk q8_0 -ctv q8_0 -cmoe
    --ctx-size $((32 * 1024)) --jinja -fa on --no-mmap --no-context-shift
    --temp 0.6 --top-k 64 --top-p 0.95 --min-p 0.00 -ngl 999 -np 1
    --swa-compress --worst-graph-tokens 1
# Optional environment variables for this model:
# env = GGML_CUDA_LAUNCH_BLOCKING=1 GGML_CUDA_GRAPH_OPT=1

[preset:regular-b2048]
model = qwen-regular
flags = -b $((4 * 512)) -ub $((2 * 512))

[preset:regular-b3072]
model = qwen-regular
flags = -b $((6 * 512)) -ub $((3 * 512))

[preset:ik-ft-b2048]
model = qwen-ik-ft
flags = -b $((4 * 512)) -ub $((2 * 512))

[preset:gemma4-b2048]
model = gemma4-ik-ft
flags = -b $((4 * 512)) -ub $((2 * 512))
